[package]
name = "cognidev"
version = "0.2.1"
description = "CogniDev — AI-Powered Developer Command Center & Second Brain"
authors = ["CogniDev Team"]
edition = "2021"
default-run = "CogniDev"

[[bin]]
name = "CogniDev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
