<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#17192b"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Left Bracket Neon Gradient (Cyan -> Indigo) -->
    <linearGradient id="leftBracket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Right Bracket Neon Gradient (Indigo -> Violet -> Rose) -->
    <linearGradient id="rightBracket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Central Neural Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Specular Reflection -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Brackets -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Shadow for Squircle -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Halo -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- macOS App Icon Squircle Base (Apple 512 squircle rx=115) -->
  <g filter="url(#squircleShadow)">
    <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bg)"/>
    <!-- Outer Rim -->
    <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  </g>

  <!-- Neural Constellation Network (Circuits & Synapses) -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="160" y1="170" x2="256" y2="200"/>
    <line x1="352" y1="170" x2="256" y2="200"/>
    <line x1="256" y1="200" x2="256" y2="312"/>
    <line x1="160" y1="342" x2="256" y2="312"/>
    <line x1="352" y1="342" x2="256" y2="312"/>
    <line x1="130" y1="256" x2="210" y2="256"/>
    <line x1="382" y1="256" x2="302" y2="256"/>
  </g>

  <!-- Constellation Nodes -->
  <g>
    <circle cx="160" cy="170" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="352" cy="170" r="4" fill="#c084fc" opacity="0.8"/>
    <circle cx="160" cy="342" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="352" cy="342" r="4" fill="#f43f5e" opacity="0.8"/>
    <circle cx="130" cy="256" r="3.5" fill="#00f2fe" opacity="0.7"/>
    <circle cx="382" cy="256" r="3.5" fill="#f43f5e" opacity="0.7"/>
  </g>

  <!-- Central Energy Glow -->
  <circle cx="256" cy="256" r="70" fill="url(#ambientGlow)"/>

  <!-- Left Code Bracket "<" (Styled as Futuristic Angled Ingot) -->
  <g filter="url(#neonGlow)">
    <path d="M 204 154
             L 132 242
             A 18 18 0 0 0 132 270
             L 204 358
             A 12 12 0 0 0 222 344
             L 162 262
             A 8 8 0 0 1 162 250
             L 222 168
             A 12 12 0 0 0 204 154 Z"
          fill="url(#leftBracket)"/>
  </g>

  <!-- Right Code Bracket ">" (Matching Futuristic Angled Ingot) -->
  <g filter="url(#neonGlow)">
    <path d="M 308 154
             L 380 242
             A 18 18 0 0 1 380 270
             L 308 358
             A 12 12 0 0 1 290 344
             L 350 262
             A 8 8 0 0 0 350 250
             L 290 168
             A 12 12 0 0 1 308 154 Z"
          fill="url(#rightBracket)"/>
  </g>

  <!-- Central Synaptic Core / Neural Diamond Slash -->
  <g filter="url(#neonGlow)">
    <!-- Central Diamond Core -->
    <path d="M 256 182
             L 278 244
             L 256 330
             L 234 268 Z"
          fill="url(#coreGrad)"/>

    <!-- Neural Pulse Node (Center Point) -->
    <circle cx="256" cy="256" r="14" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="256" r="22" fill="#38bdf8" opacity="0.35"/>
    <circle cx="256" cy="256" r="34" fill="#a855f7" opacity="0.2"/>
  </g>

  <!-- Upper Glass Sheen (Apple App Icon Top Arc Reflection) -->
  <path d="M 32 140
           C 32 80 80 32 140 32
           L 372 32
           C 432 32 480 80 480 140
           L 480 220
           C 340 180 172 180 32 220 Z"
        fill="url(#glassSheen)"
        opacity="0.9"/>
</svg>
