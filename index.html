<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniDev — AI-First Developer OS</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0f1013;
        overflow: hidden;
        user-select: none;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(0.97); }
      }
      .cognidev-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 14px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .cognidev-splash img {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(56, 189, 248, 0.25);
      }
      .cognidev-splash span {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="cognidev-splash">
        <img src="/logo.svg" alt="CogniDev" />
        <span>CogniDev yuklanmoqda...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
